<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto-Scale Line Scan</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            touch-action: none;
        }

        #controls {
            padding: 15px;
            background: rgba(20, 20, 20, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        #btn-action { background-color: #00d26a; color: #000; min-width: 80px;}
        #btn-action.stop { background-color: #ff4757; color: white; }
        #btn-save { background-color: #2e86de; color: white; display: none; }
        
        .toggle-container {
            display: flex;
            align-items: center;
            font-size: 12px;
            gap: 5px;
            color: #ccc;
        }

        #display-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        #display-canvas {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        #preview-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            height: 140px;
            border: 2px solid #00d26a;
            border-radius: 8px;
            z-index: 20;
            background: #000;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        
        #preview-container.active { opacity: 1; }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mirrored {
            transform: scaleX(-1);
        }

        #slice-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 0, 0.8);
            box-shadow: 0 0 4px rgba(255, 255, 0, 0.5);
            transform: translateX(-50%);
            z-index: 21;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="toggle-container">
            <input type="checkbox" id="mirror-check" checked>
            <label for="mirror-check">Mirror View</label>
        </div>
        <div class="btn-group">
            <button id="btn-save">Save</button>
            <button id="btn-action">Start Cam</button>
        </div>
    </div>

    <div id="display-area">
        <canvas id="display-canvas"></canvas>
    </div>

    <div id="preview-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="slice-line"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const displayArea = document.getElementById('display-area');
        const displayCanvas = document.getElementById('display-canvas');
        const displayCtx = displayCanvas.getContext('2d', { alpha: false });
        
        const btnAction = document.getElementById('btn-action');
        const btnSave = document.getElementById('btn-save');
        const mirrorCheck = document.getElementById('mirror-check');
        const previewContainer = document.getElementById('preview-container');

        let isScanning = false;
        let animationId;
        let currentX = 0;
        let stream = null;
        
        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d', { alpha: false });
        
        const MAX_WIDTH = 8000; 
        let scanSpeed = 1;

        btnAction.onclick = async () => {
            if (!stream) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "environment", 
                            width: { ideal: 1280 }, 
                            height: { ideal: 720 },
                            frameRate: { ideal: 60 }
                        }, 
                        audio: false 
                    });
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        bufferCanvas.height = video.videoHeight;
                        bufferCanvas.width = MAX_WIDTH;
                        
                        const rect = document.getElementById('display-area').getBoundingClientRect();
                        displayCanvas.width = rect.width * window.devicePixelRatio;
                        displayCanvas.height = rect.height * window.devicePixelRatio;
                        
                        displayCtx.fillStyle = "#111";
                        displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
                        
                        previewContainer.classList.add('active');
                        btnAction.innerText = "Start Scan";
                        btnAction.onclick = toggleScan;

                        updateMirror();

                        /* IMPORTANT FIX FOR SAFARI + GITHUB PAGES */
                        video.play().catch(e => console.warn("Autoplay blocked:", e));
                    };
                } catch (err) {
                    alert("Camera Error: " + err.message);
                }
            }
        };

        function redrawImageToDisplay() {
            if (currentX > 0) {
                displayCtx.drawImage(
                    bufferCanvas, 
                    0, 0, currentX, bufferCanvas.height, 
                    0, 0, displayCanvas.width, displayCanvas.height
                );
            } else {
                displayCtx.fillStyle = "#111";
                displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);
            }
        }

        mirrorCheck.onchange = updateMirror;
        function updateMirror() {
            if (mirrorCheck.checked) {
                video.classList.add('mirrored');
            } else {
                video.classList.remove('mirrored');
            }
        }

        function scanLoop() {
            if (!isScanning) return;

            const centerX = Math.floor(video.videoWidth / 2);
            
            bufferCtx.drawImage(video, 
                centerX, 0, 1, video.videoHeight,
                currentX, 0, 1, video.videoHeight
            );

            currentX += scanSpeed;

            redrawImageToDisplay();

            if (currentX >= MAX_WIDTH) {
                stopScan();
                return;
            }

            animationId = requestAnimationFrame(scanLoop);
        }

        function toggleScan() {
            if (isScanning) {
                stopScan();
            } else {
                isScanning = true;
                btnAction.innerText = "Stop";
                btnAction.classList.add('stop');
                btnSave.style.display = 'none';
                currentX = 0;
                scanLoop();
            }
        }

        function stopScan() {
            isScanning = false;
            cancelAnimationFrame(animationId);
            btnAction.innerText = "New Scan";
            btnAction.classList.remove('stop');
            btnSave.style.display = 'inline-block';
        }

        btnSave.onclick = () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = currentX;
            tempCanvas.height = bufferCanvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.drawImage(bufferCanvas, 0, 0, currentX, bufferCanvas.height, 0, 0, currentX, bufferCanvas.height);
            
            const link = document.createElement('a');
            link.download = `scan-${Date.now()}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        };

        window.addEventListener('resize', () => {
            if(stream) {
                const rect = document.getElementById('display-area').getBoundingClientRect();
                displayCanvas.width = rect.width * window.devicePixelRatio;
                displayCanvas.height = rect.height * window.devicePixelRatio;
                if (!isScanning && currentX > 0) {
                     redrawImageToDisplay();
                }
            }
        });

        function handleInputMove(e) {
            if (isScanning || currentX === 0) return;

            e.preventDefault();

            const rect = displayCanvas.getBoundingClientRect();
            let clientX = e.clientX;
            
            if(e.type === 'touchmove' || e.type === 'touchstart') {
                clientX = e.touches[0].clientX;
            }

            const scaleX = displayCanvas.width / rect.width;
            const canvasX = (clientX - rect.left) * scaleX;

            redrawImageToDisplay();

            displayCtx.beginPath();
            displayCtx.moveTo(canvasX, 0);
            displayCtx.lineTo(canvasX, displayCanvas.height);
            displayCtx.strokeStyle = '#00d26a';
            displayCtx.lineWidth = 3;
            displayCtx.shadowColor = "black";
            displayCtx.shadowBlur = 5;
            displayCtx.stroke();
        }

        function handleInputLeave() {
            if (!isScanning && currentX > 0) {
                redrawImageToDisplay();
            }
        }

        displayArea.addEventListener('mousemove', handleInputMove);
        displayArea.addEventListener('touchmove', handleInputMove, { passive: false });
        displayArea.addEventListener('touchstart', handleInputMove, { passive: false });
        displayArea.addEventListener('mouseleave', handleInputLeave);
        displayArea.addEventListener('touchend', handleInputLeave);

    </script>
</body>
</html>
